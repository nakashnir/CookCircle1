kind = "web"
previewPath = "/"
title = "CookCircle"
version = "1.0.0"
id = "artifacts/cookcircle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20809

[services.development]
run = "pnpm --filter @workspace/cookcircle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cookcircle", "run", "build" ]
publicDir = "artifacts/cookcircle/_static"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20809"
BASE_PATH = "/"
